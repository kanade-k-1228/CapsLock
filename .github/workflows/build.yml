name: Build

on:
  push:
    branches: [main]
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  pull_request:
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download AutoHotkey v1 and Ahk2Exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.37.02 -R AutoHotkey/AutoHotkey -p "AutoHotkey_1.1.37.02.zip" -D dl
          gh release download -R AutoHotkey/Ahk2Exe -p "Ahk2Exe*.zip" -D dl
          Expand-Archive dl\AutoHotkey_1.1.37.02.zip -DestinationPath ahk
          Get-ChildItem dl -Filter "Ahk2Exe*.zip" | ForEach-Object { Expand-Archive $_.FullName -DestinationPath ahk2exe }
        shell: pwsh

      - name: Compile F13.ahk to F13.exe
        run: |
          $ahk2exe = Get-ChildItem ahk2exe -Filter Ahk2Exe.exe -Recurse | Select-Object -First 1
          $base = Get-ChildItem ahk -Filter AutoHotkeyU64.exe -Recurse | Select-Object -First 1
          if (-not $ahk2exe -or -not $base) {
            $files = (Get-ChildItem ahk, ahk2exe -Recurse -File | ForEach-Object Name) -join ', '
            Write-Output "::error::Ahk2Exe or base not found. Files: $files"
            exit 1
          }
          $out = & $ahk2exe.FullName /in F13.ahk /out F13.exe /base $base.FullName /silent verbose 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0 -or -not (Test-Path F13.exe)) {
            $msg = ($out -replace "`r?`n", ' | ').Trim()
            Write-Output "::error::Ahk2Exe failed (exit $code): $msg"
            exit 1
          }
        shell: pwsh

      - name: Upload F13.exe artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: F13.exe
          path: F13.exe
          if-no-files-found: error
