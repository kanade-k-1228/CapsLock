name: Build

on:
  push:
    branches: [main]
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  pull_request:
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey
        run: choco install autohotkey --version=1.1.37.1 -y --no-progress

      - name: Compile F13.ahk to F13.exe
        run: |
          $ahk2exe = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          if (-not (Test-Path $ahk2exe)) { throw "Ahk2Exe not found: $ahk2exe" }
          $p = Start-Process -FilePath $ahk2exe -ArgumentList '/in', 'F13.ahk', '/out', 'F13.exe' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path F13.exe)) { throw "Compile failed (exit $($p.ExitCode))" }
        shell: pwsh

      - name: Upload F13.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: F13.exe
          path: F13.exe
          if-no-files-found: error
