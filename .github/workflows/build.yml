name: Build

on:
  push:
    branches: [main]
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  pull_request:
    paths: ["F13.ahk", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey
        run: choco install autohotkey --version=1.1.37.1 -y --no-progress

      - name: Compile F13.ahk to F13.exe
        run: |
          $roots = @("$env:ProgramFiles\AutoHotkey", "${env:ProgramFiles(x86)}\AutoHotkey", "$env:ChocolateyInstall\lib")
          $ahk2exe = Get-ChildItem -Path $roots -Filter Ahk2Exe.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ahk2exe) {
            Write-Output "::error::Ahk2Exe.exe not found under: $($roots -join ', ')"
            exit 1
          }
          Write-Output "::notice::Using $($ahk2exe.FullName)"
          $out = & $ahk2exe.FullName /in F13.ahk /out F13.exe /silent verbose 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0 -or -not (Test-Path F13.exe)) {
            $msg = ($out -replace "`r?`n", ' | ').Trim()
            Write-Output "::error::Ahk2Exe failed (exit $code): $msg"
            exit 1
          }
        shell: pwsh

      - name: Upload F13.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: F13.exe
          path: F13.exe
          if-no-files-found: error
